name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Type check
        run: npm run typecheck
        continue-on-error: true  # Obsidian types may not resolve in CI

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
